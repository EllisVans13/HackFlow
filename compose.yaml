services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hackflow
      POSTGRES_USER: hackflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackflow -d hackflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://hackflow:${POSTGRES_PASSWORD}@db:5432/hackflow
    command: ["sh", "-c", "flask --app wsgi db upgrade && flask --app wsgi seed-review-demo"]
    volumes:
      - upload_data:/app/data
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://hackflow:${POSTGRES_PASSWORD}@db:5432/hackflow
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - upload_data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
  reminders:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://hackflow:${POSTGRES_PASSWORD}@db:5432/hackflow
    command: ["python", "-m", "hackflow.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    profiles: ["production"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    depends_on:
      - app
    restart: unless-stopped
volumes:
  postgres_data:
  upload_data:
  caddy_data:
  caddy_config:
